<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <clipPath id="badge">
      <rect x="14" y="14" width="164" height="164" rx="42"/>
    </clipPath>
  </defs>
  <!-- Grounded playful offset drop shadow -->
  <rect x="14" y="20" width="164" height="164" rx="42" fill="#242b32" opacity=".16"/>
  <!-- Split Orange (P1) vs Blue (P2) Rivalry Squircle Badge -->
  <g clip-path="url(#badge)">
    <!-- Sky Blue (Player 2 / right half) -->
    <rect x="14" y="14" width="164" height="164" fill="#58addb"/>
    <!-- Warm Orange (Player 1 / left half) -->
    <path d="M14 14 H108 L84 178 H14 Z" fill="#f49b58"/>
    <!-- Clean unified soft top gloss & bottom rim shading -->
    <path d="M14 14 H178 V45 C138 34 54 34 14 45 Z" fill="#ffffff" opacity=".2"/>
    <path d="M14 156 C54 166 138 166 178 156 V178 H14 Z" fill="#242b32" opacity=".11"/>
    <!-- Crisp diagonal clash seam aligned with lightning tips -->
    <path d="M108 10 L84 182" stroke="#242b32" stroke-width="6"/>
  </g>

  <!-- Crisp rounded ink outer border -->
  <rect x="14" y="14" width="164" height="164" rx="42" fill="none" stroke="#242b32" stroke-width="9"/>

  <!-- Signature Pocket Rivals player marks: symmetrically balanced × and ○ -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Orange P1 bold cream × -->
    <path d="M34 83 L60 109 M60 83 L34 109" stroke="#242b32" stroke-width="15"/>
    <path d="M34 83 L60 109 M60 83 L34 109" stroke="#fffdf5" stroke-width="8"/>
    <!-- Blue P2 bold cream ○ -->
    <circle cx="145" cy="96" r="13.5" stroke="#242b32" stroke-width="15"/>
    <circle cx="145" cy="96" r="13.5" stroke="#fffdf5" stroke-width="8"/>
  </g>

  <!-- Bold sunlit-gold rivalry lightning bolt cleanly separated from × and ○ -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M106 30 L75 100 H95 L86 162 L117 90 H97 Z" fill="#ffe066" stroke="#242b32" stroke-width="6"/>
    <path d="M97 96 L111 94 L90 144 L97 100 Z" fill="#f5be35" opacity=".55"/>
    <path d="M101 47 L84 92" stroke="#fff9db" stroke-width="3.5" fill="none"/>
  </g>

  <!-- Subtle 4-point diamond sparkles echoing the hero stars -->
  <path d="M47 41 L49.5 46.5 L55 49 L49.5 51.5 L47 57 L44.5 51.5 L39 49 L44.5 46.5 Z" fill="#fffdf5"/>
  <path d="M145 135 L147.5 140.5 L153 143 L147.5 145.5 L145 151 L142.5 145.5 L137 143 L142.5 140.5 Z" fill="#fffdf5"/>
</svg>
