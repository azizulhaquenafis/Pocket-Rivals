    <path d="M126 177l6 22 6-22Z" fill="#ffe27a" stroke-width="3.6"/>
    <path d="M142 177l6 22 6-22Z" fill="#ffe27a" stroke-width="3.6"/>
    <path d="M133 176l7 28 7-28Z" fill="#fffdf5" stroke-width="3.6"/>
    <!-- Hero Starfighter (swept wings, wingtip cannons, orange hull & domed blue cockpit) -->
    <!-- Wingtip laser cannons -->
    <path d="M107 152v-19m66 19v-19" stroke-width="5"/>
    <!-- Outer swept wings -->
    <path d="M140 107l-52 60 22 10 30-11 30 11 22-10Z" fill="#f49b58"/>
    <!-- Cream wing trim stripes -->
    <path d="M111 153l16-19m42 19l-16-19" stroke="#ffd8a8" stroke-width="3.8"/>
    <!-- Central sleek fuselage -->
    <path d="M140 96l-21 79h42Z" fill="#f49b58"/>
    <path d="M140 96l-13 50h26Z" fill="#ffba7a" stroke="none"/>
    <path d="M140 96l-21 79h42Z" fill="none"/>
    <!-- Glossy sky-blue domed glass cockpit -->
    <rect x="130" y="128" width="20" height="30" rx="10" fill="#58addb" stroke-width="4.2"/>
    <path d="M135 135v12" stroke="#c7eeff" stroke-width="3.4"/>
    <circle cx="135" cy="151" r="1.7" fill="#fffdf5" stroke="none"/>
  </g>
